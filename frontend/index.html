<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values on notched iPhones. Without it the bottom tab bar sits under
         the home indicator and the insets in style.css all resolve to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Travel Steezy - where next?</title>
    <meta name="description" content="A multi-agent travel assistant for long-term backpackers." />
    <meta name="theme-color" content="#181b15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  </head>

  </body>
</html>
