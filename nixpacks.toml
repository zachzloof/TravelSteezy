# Railway build: the frontend is compiled to static files and served by FastAPI,
# so the whole app is one service on one origin with no CORS for a visitor to hit.
[phases.setup]
nixPkgs = ["python313", "nodejs_20"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt",
  "cd frontend && npm ci"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "python -m scripts.bootstrap && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
